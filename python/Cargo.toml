[package]
name = "feature-factory-py"
version = "0.1.0-a.1"
edition = "2024"
publish = false

[lib]
name = "feature_factory"
crate-type = ["cdylib"]

[dependencies]
feature-factory = { path = "..", features = ["pyo3"] }
pyo3 = { version = "0.24.1", features = ["abi3-py311", "extension-module"] }
pyo3-arrow = "0.9.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
datafusion = "49.0.2"
arrow = { version = "55.2.0", features = ["pyarrow"] }
